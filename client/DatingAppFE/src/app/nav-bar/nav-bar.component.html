<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Dating App</a>
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                @if(accountService.currentUser()){
                    <li class="nav-item">
                        <a class="nav-link active" routerLinkActive="active" routerLink="/members">Matches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLinkActive="active" routerLink="/lists">Link</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLinkActive="active" routerLink="/messages">Messages</a>
                    </li>
                }
                <li class="nav-item">
                    <a class="nav-link" routerLinkActive="active" routerLink="/errors">Errors</a>
                </li>
            </ul>
            @if(accountService.currentUser()){
                <div dropdown class="dropdown">
                    <img
                        class="me-2"  
                        src="{{accountService.currentUser()?.photoUrl || './assets/user.png'}}" 
                        alt="user main image">
                    <a dropdownToggle class="dropdown-toggle text-light text-decoration-none">
                        Welcome {{accountService.currentUser()?.knownAs }}
                    </a>
                    <div *dropdownMenu class="dropdown-menu">
                        <a routerLink="/member/edit" class="dropdown-item">Edit profile</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" (click)="logout()">Logout</a>
                    </div>
                </div>
            }
            @else{
                <div style="float:right">
                    <form #formLogin="ngForm" class="d-flex" (submit)="login()">
                        <input name="userame" [(ngModel)]="model.username" class="form-group me-2" type="text"
                            placeholder="Username">
                        <input name="password" [(ngModel)]="model.password" class="form-group me-2" type="password"
                            placeholder="Password" autocomplete="new-password">
                        <button class="btn btn-success" type="submit">Login</button>
                    </form>
                </div>
            }
    </div>
</nav>
